[project]
name = "resqview"
version = "1.0.0"
description = "A live common operating picture for disaster response — decision support, never dispatch."
requires-python = ">=3.11"

# Runtime dependencies for the deployed API. uvicorn is deliberately absent: the hosting
# platform supplies the ASGI server. Local and Docker runs use backend/requirements.txt,
# which does include it.
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[tool.vercel]
# The FastAPI app lives under backend/, not at the repository root.
entrypoint = "backend.app.main:app"
